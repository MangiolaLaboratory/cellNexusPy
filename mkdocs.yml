site_name: cellNexusPy
repo_url: https://github.com/MangiolaLaboratory/cellNexusPy

theme:
  name: material  # Beautiful, widely used theme

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy  # or google, restructured

nav:
  - Home: index.md
  - API Reference: api.md
  - Examples: README.md